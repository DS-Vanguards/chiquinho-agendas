{% extends "base.html" %}
{% block title %}Escolher turno{% endblock %}
{% block content %}
<div class="auth-card shift-pick-card">
    <h1>Qual é o seu turno?</h1>
    <p class="subtitle">No primeiro acesso, escolha o turno em que você dá aula. A agenda mostrará só os horários e as salas desse período.</p>

    <form method="POST" class="shift-pick-form">
        <button type="submit" name="shift" value="manha" class="shift-pick-option">
            <strong>Turno 1</strong>
            <span>Maker, auditório, sala de leitura e sala de artes</span>
        </button>
        <button type="submit" name="shift" value="tarde" class="shift-pick-option">
            <strong>Turno 2</strong>
            <span>Salas 01 a 04, auditório, informática, sala de leitura e sala de artes</span>
        </button>
    </form>
</div>
{% endblock %}
