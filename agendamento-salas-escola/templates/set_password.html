{% extends "base.html" %}
{% block title %}Definir Senha{% endblock %}
{% block content %}
<div class="auth-card">
    <h1>Definir Nova Senha</h1>
    {% if forced %}
    <p class="subtitle">Olá, <strong>{{ user.username }}</strong>! Sua senha foi redefinida. Crie uma nova senha para continuar.</p>
    {% else %}
    <p class="subtitle">Crie uma senha para sua conta.</p>
    {% endif %}

    <form method="POST" action="{{ url_for('set_password') }}" class="form">
        <label for="password">Nova senha</label>
        <input type="password" id="password" name="password" required minlength="6" autofocus>

        <label for="confirm_password">Confirmar nova senha</label>
        <input type="password" id="confirm_password" name="confirm_password" required minlength="6">

        <button type="submit" class="btn btn-primary btn-block">Salvar senha</button>
    </form>
</div>
{% endblock %}
